<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="1024" height="1024" rx="220" fill="url(#g)"/>

  <!-- Top gloss -->
  <rect x="64" y="64" width="896" height="420" rx="180" fill="#ffffff" opacity="0.08"/>

  <!-- Connection line -->
  <rect x="392" y="488" width="240" height="48" rx="24" fill="#ffffff"/>

  <!-- Left node = client (ring) -->
  <circle cx="312" cy="512" r="86" fill="#ffffff"/>
  <circle cx="312" cy="512" r="40" fill="#4F46E5"/>

  <!-- Right node = server (stacked bars) -->
  <rect x="636" y="426" width="172" height="172" rx="36" fill="#ffffff"/>
  <rect x="676" y="470" width="92" height="20" rx="10" fill="#06B6D4"/>
  <rect x="676" y="510" width="92" height="20" rx="10" fill="#06B6D4"/>
  <rect x="676" y="550" width="60" height="20" rx="10" fill="#06B6D4"/>

  <!-- Live request pulse -->
  <circle cx="512" cy="512" r="30" fill="#34D399"/>
</svg>
